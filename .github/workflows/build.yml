name: Build Android (debug-signed)

on:
  workflow_dispatch:
  push:

jobs:
  android:
    name: Build Android (release, debug-signed)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Allocate adequate JVM heap to prevent aggressive GC cycles on the 2-core runner
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Force release build type to sign with debug key
        working-directory: android/app
        run: |
          if grep -q "signingConfig signingConfigs.release" build.gradle; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' build.gradle
            echo "Patched release buildType to use debug signingConfig"
          else
            echo "release buildType already uses debug signingConfig (Expo default)"
          fi

      - name: Build release APK (debug-signed)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --build-cache

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-debugsigned-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
